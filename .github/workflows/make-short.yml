name: make-short

on:
  schedule:
    # 5 runs a day (UTC). Pakistan time (UTC+5): 06:17, 11:17, 16:17, 21:17, 02:17
    - cron: "17 1,6,11,16,21 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (leave empty = AI picks a fresh one)"
        default: ""
      voice:
        description: "Voice"
        default: "en-US-GuyNeural"

permissions:
  contents: write

concurrency:
  group: make-short
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-dejavu-extra libcairo2
          pip install -U numpy pillow edge-tts gtts requests cairosvg emoji
      - name: Make the Short
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          VOICE: ${{ inputs.voice }}
        run: python make_short.py
      - name: Keep a copy on GitHub (14 days)
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          retention-days: 14
          path: |
            out/short.mp4
            out/upload_info.txt
      - name: Upload to Google Drive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python upload_drive.py
      - name: Remember the topic
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add topics.txt
          git commit -m "topic used" || true
          git pull --rebase || true
          git push || true
