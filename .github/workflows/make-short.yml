name: make-short

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (leave empty = AI picks a fresh one)"
        default: ""
      voice:
        description: "Voice"
        default: "en-US-GuyNeural"

permissions:
  contents: write
  models: read

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-dejavu-extra libcairo2
          pip install -U numpy pillow edge-tts gtts requests cairosvg emoji
      - name: Make the Short
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          VOICE: ${{ inputs.voice }}
        run: python make_short.py
      - uses: actions/upload-artifact@v4
        with:
          name: short
          path: |
            out/short.mp4
            out/upload_info.txt
      - name: Remember the topic
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add topics.txt
          git commit -m "topic used" || true
          git push || true
